name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev

          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install cython==0.29.33

      - name: Prepare Buildozer
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

          echo "===== Buildozer configuration ====="
          cat buildozer.spec

      - name: Configure Android settings
        run: |
          if grep -q "^# *android.accept_sdk_license" buildozer.spec; then
            sed -i \
              's/^# *android.accept_sdk_license.*/android.accept_sdk_license = True/' \
              buildozer.spec
          elif ! grep -q "^android.accept_sdk_license" buildozer.spec; then
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          if grep -q "^# *android.build_tools_version" buildozer.spec; then
            sed -i \
              's/^# *android.build_tools_version.*/android.build_tools_version = 33.0.2/' \
              buildozer.spec
          elif ! grep -q "^android.build_tools_version" buildozer.spec; then
            echo "android.build_tools_version = 33.0.2" >> buildozer.spec
          fi

          echo "===== Final configuration ====="
          grep -E "android.accept_sdk_license|android.build_tools_version" buildozer.spec || true

      - name: Build Android APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: bin/*.apk
          if-no-files-found: error
